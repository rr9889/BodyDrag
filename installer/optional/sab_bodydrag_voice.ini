# Optional: copy to your game folder (next to Saboteur.exe) to change Sean's drag voice/face (read at every grab).
# Missing keys keep these defaults. Event / expression names: letters, digits and _ only; empty = cue off.
enabled = yes
faces = yes

# Pickup: Sean's heavy melee effort grunt when the body leaves the ground (seconds into qol_drag_in)
lift_event = Sean_Mis_GrntPnchL
lift_at_s = 1.0
lift_face = FaceExp_Pain
lift_face_s = 0.9

# Release: his light effort grunt at the heave before the supported descent (seconds into qol_drag_out)
lower_event = Sean_Mis_GrntPnchS
lower_at_s = 0.5
lower_face = FaceExp_BrowPain
lower_face_s = 0.8

# Occasional exertion while dragging: off (Sean has no native breathing line). Sean_MEL_Block is the nearest effort huff.
breath_event =
breath_after_s = 8
breath_gap_s = 15
breath_chance = 0.5

# No two vocals closer than this
min_gap_s = 2.5

# Sean's occasional one-liners (his original in-game voice lines). remarks = off disables them alone.
remarks = yes
pickup_chance = 0.20
pickup_at_s = 1.70
release_chance = 0.12
release_at_s = 1.15
# dragging: first check after this many seconds of continuous walking, then every drag_check_s; at most one per drag
drag_chance = 0.15
drag_after_s = 6
drag_check_s = 6
# seconds between any two remarks (across pickups), and how many recent lines are never picked again
remark_cooldown_s = 30
remark_no_repeat = 4
