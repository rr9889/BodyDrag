# Optional: copy to your game folder (next to Saboteur.exe). Read when the game starts.
# Action key (default F7). Keys the game already uses (see InputTemplates.txt) are refused and F7 is kept.
# Supported: F1-F12, A-Z, 0-9, Numpad0-Numpad9, Insert, Delete, Home, End
action_key = F7
# On-screen prompt "Pick up body [key]" / "Put down body [key]": on (default) or off
prompt = on
