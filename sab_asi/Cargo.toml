[package]
name = "sab_asi"
version = "0.1.0"
edition = "2021"
description = "In-process engine SDK for The Saboteur (x86): MinHook detours + a Dev.* Lua binding surface."

[lib]
crate-type = ["cdylib"]

[dependencies]
minhook-sys = "0.1"

[features]
# `dev`: the developer surface - F9 runs sab_run.lua (debug body spawn etc.), sab_cmd.lua watcher, F10 camera log,
# the Dev.* Lua table, the body-setup research probe. Public release: cargo build --release --no-default-features
default = ["dev"]
dev = []

[profile.release]
panic = "abort"   # a Rust unwind across the FFI/thiscall boundary is UB; abort instead.
opt-level = 2
